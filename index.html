<style>

.btn.lock{opacity:.3}
@keyframes fk{0%,92%,100%{opacity:1}94%{opacity:.4}96%{opacity:.9}98%{opacity:.5}}#menu h1{animation:fk 4s infinite}

}

const $=id=>document.getElementById(id),R=Math.random,V3=(x,y,z)=>new THREE.Vector3(x,y,z);

// ---------- 아레나 ----------
const A=40,obs=[],obsM=[],PAL=[0x6f9fd0,0x8fd9c9,0xb8c4d2,0xd9b27a];

bx(0,-A-1,A*2+4,10,2,0x6f9fd0);bx(0,A+1,A*2+4,10,2,0x6f9fd0);bx(-A-1,0,2,10,A*2,0x8fd9c9);bx(A+1,0,2,10,A*2,0x8fd9c9);

let AC,NB,MG,SG,BG,nT=0,bs=0;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;MG=AC.createGain();MG.connect(AC.destination);SG=AC.createGain();SG.connect(MG);BG=AC.createGain();BG.connect(MG);applyAudio();setInterval(bgm,100)}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
function tone(f1,f2,du,ty='sine',v=.2,dl=0){if(!AC)return;const t=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+du);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+du);o.connect(g);g.connect(SG);o.start(t);o.stop(t+du+.02)}

for(const g of gr.slice()){g.t-=dt;g.age+=dt;g.v.y-=20*dt;const p=g.m.position;p.addScaledVector(g.v,dt);g.m.rotation.x+=dt*8;
if(p.y<.14){p.y=.14;g.v.y*=-.45;g.v.x*=.75;g.v.z*=.75}
for(const o of obs)if(p.y<o.h&&Math.abs(p.x-o.x)<o.hw+.1&&Math.abs(p.z-o.z)<o.hd+.1){p.x-=g.v.x*dt;p.z-=g.v.z*dt;g.v.x*=-.5;g.v.z*=-.5}
let ex=g.t<=0;if(g.age>.15)for(const e of en)if(Math.hypot(e.g.position.x-p.x,e.g.position.y+e.cy-p.y,e.g.position.z-p.z)<1.2)ex=1;
if(ex){scene.remove(g.m);gr.splice(gr.indexOf(g),1);blast(p.clone(),8,140)}}
// 이펙트
for(const q of pts.slice()){q.l-=dt;q.v.y-=15*dt;q.o.position.addScaledVector(q.v,dt);if(q.o.position.y<.03){q.o.position.y=.03;q.v.y*=-.4}q.o.scale.setScalar(Math.max(.001,q.s*q.l/q.L));if(q.l<=0){scene.remove(q.o);pts.splice(pts.indexOf(q),1)}}
for(const t of trs.slice()){t.t-=dt;t.l.material.opacity=Math.max(0,t.t/.07);if(t.t<=0){scene.remove(t.l);t.l.geometry.dispose();trs.splice(trs.indexOf(t),1)}}
for(const x of exps.slice()){x.t+=dt;const f=x.t/.4;x.m.scale.setScalar(x.r*Math.min(1,f)+.1);x.m.material.opacity=Math.max(0,.8*(1-f));if(f>=1){scene.remove(x.m);exps.splice(exps.indexOf(x),1)}}
eL.intensity=Math.max(0,eL.intensity-dt*20);mL.intensity=Math.max(0,mL.intensity-dt*60);if(flT<=0)fl.visible=false;
// 카메라 / 총

cam.position.set(P.x+(R()-.5)*sh*.12,P.y+1.7+(R()-.5)*sh*.12,P.z);
cam.rotation.set(P.pitch+(R()-.5)*sh*.04+kick*.01,P.yaw,(R()-.5)*sh*.06);
const rlk=rlT>0?Math.sin(Math.min(1,(W[cw].rl-rlT)/W[cw].rl)*Math.PI):0;
gunG.position.set(.26+Math.sin(bobT)*.006*(mv>1),-.24+Math.abs(Math.sin(bobT))*.008*(mv>1)-rlk*.18-swT*.5,-.5+kick*.1);
gunG.rotation.set(kick*.22+rlk*.7+swT*1.2,0,rlk*.4);
zf+=((zoom&&cw==3&&rlT<=0?20:bf())-zf)*Math.min(1,14*dt);cam.fov=zf+kick*1.5;cam.updateProjectionMatrix();$('scope').style.display=zf<45?'block':'none';
}
function hud(dt){dmgA=Math.max(0,dmgA-dt*1.6);const low=P.hp<45&&state==1?.25+.1*Math.sin(T*6):0;$('dmg').style.opacity=Math.max(dmgA*.9,low);
hmT=Math.max(0,hmT-dt);$('hm').style.opacity=hmT/.18;
$('hpb').style.width=P.hp/1.5+'%';$('hpt').textContent=Math.ceil(P.hp);const w=W[cw];$('am').textContent=w?(rlT>0?'RELOAD':w.mag+' / '+w.max):'';
banT=Math.max(0,banT-dt);$('ban').style.opacity=Math.min(1,banT);
const x=mm,S=55/45;x.clearRect(0,0,110,110);x.save();x.beginPath();x.arc(55,55,53,0,6.283);x.clip();
x.strokeStyle='rgba(255,255,255,.14)';x.beginPath();x.arc(55,55,27,0,6.283);x.stroke();x.beginPath();x.moveTo(55,0);x.lineTo(55,110);x.moveTo(0,55);x.lineTo(110,55);x.stroke();
const c=Math.cos(P.yaw),s=Math.sin(P.yaw),pl=(wx,wz,col,r)=>{const dx=wx-P.x,dz=wz-P.z;x.fillStyle=col;x.beginPath();x.arc(55+(dx*c-dz*s)*S,55+(dx*s+dz*c)*S,r,0,6.283);x.fill()};
obs.slice(4).forEach(o=>pl(o.x,o.z,'rgba(160,180,200,.45)',2));en.forEach(e=>pl(e.g.position.x,e.g.position.z,e.t=='r'?'#e8845a':'#e8c25a',3.5));
x.fillStyle='#9fe0d0';x.beginPath();x.moveTo(55,49);x.lineTo(60,60);x.lineTo(50,60);x.fill();x.restore()}
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1e3);last=n;T+=dt;const pl=state==1;$('hud').style.display=pl?'block':'none';$('wsel').style.display=pl?'flex':'none';
if(state==1){if(!paused){update(dt);hud(dt)}}else{cam.position.set(Math.cos(T*.2)*26,7,Math.sin(T*.2)*26);cam.lookAt(0,2,0);gunG.visible=false;$('scope').style.display='none';zf=bf();cam.fov=zf;cam.updateProjectionMatrix();
for(const q of pts.slice()){q.l-=dt;if(q.l<=0){scene.remove(q.o);pts.splice(pts.indexOf(q),1)}}}
