else if(cw==1){SND.shot();shoot(8,.06,10,1);P.pitch+=.05;sh=Math.max(sh,.45)}
else{SND.gren();throwG()}
if(cw<2){mL.intensity=3;fl.visible=true;fl.rotation.z=R()*6;fl.scale.setScalar(.7+R()*.6)}}
function reload(){const w=W[cw];if(rlT>0||w.mag==w.max||state!=1)return;rlT=w.rl;SND.rl(w.rl)}
// ---------- 웨이브 ----------
function banner(t){$('ban').textContent=t;banT=2.2}
function nextWave(){wave++;spawnLeft=4+wave*2;spawnT=0;$('wv').textContent=wave;banner('WAVE '+wave)}
function reset(){en.concat().forEach(e=>scene.remove(e.g));en.length=0;eb.forEach(b=>scene.remove(b.m));eb.length=0;gr.forEach(b=>scene.remove(b.m));gr.length=0;
Object.assign(P,{x:0,z:8,y:0,vx:0,vz:0,vy:0,hp:100,yaw:0,pitch:0});W.forEach(w=>w.mag=w.max);wave=0;score=0;gapOn=0;rlT=0;$('sc').textContent=0;cw=-1;sw(0);nextWave()}
function start(){ac();if(state!=1){reset();state=1}paused=false;$('menu').style.display='none';
try{if(isT){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}else{const r=document.body.requestPointerLock();r&&r.catch&&r.catch(()=>{})}}catch(e){}}
function over(){state=2;try{localStorage.setItem('neonStrikeBest',best)}catch(e){}document.exitPointerLock&&document.exitPointerLock();
$('mt').textContent='GAME OVER';$('mp').innerHTML='웨이브 '+wave+' · 점수 '+score+'<br>최고기록 '+best;$('play').textContent='다시 시작';$('menu').style.display='flex'}
function pause(){if(state!=1||paused)return;paused=true;fireH=0;$('mt').textContent='PAUSED';$('mp').textContent='계속하려면 버튼을 눌러줘';$('play').textContent='계속';$('menu').style.display='flex'}
$('play').addEventListener('click',()=>{if(state==2){state=0}start()});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&state==1&&!isT)pause()});
// ---------- 입력 ----------
const K={};function look(dx,dy){P.yaw-=dx;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-dy))}
addEventListener('keydown',e=>{K[e.code]=1;if(state!=1||paused)return;if(e.code=='KeyR')reload();if(e.code=='Digit1')sw(0);if(e.code=='Digit2')sw(1);if(e.code=='Digit3')sw(2);if(e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
addEventListener('mousemove',e=>{if(state==1&&!paused&&(document.pointerLockElement||e.buttons&1))look(e.movementX*.0022,e.movementY*.0022)});
addEventListener('mousedown',e=>{if(e.button==0&&state==1&&!paused&&!e.target.closest('.btn'))fireH=1});addEventListener('mouseup',()=>{if(!isT)fireH=0});
document.querySelectorAll('#wsel .btn').forEach(b=>b.addEventListener('pointerdown',e=>{if(state==1&&!paused)sw(+b.dataset.w)}));
function hold(id,on,off){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();on()});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>off&&off()))}
hold('bf',()=>fireH=1,()=>fireH=0);hold('bj',()=>jmp=1,()=>jmp=0);hold('br',()=>reload());
const TJ={},TL={};
document.addEventListener('touchstart',e=>{if(state!=1||paused)return;e.preventDefault();for(const t of e.changedTouches){if(t.target.closest('.btn'))continue;
if(t.clientX<innerWidth*.42&&!TJ.id&&TJ.id!==0){TJ.id=t.identifier;TJ.x=t.clientX;TJ.y=t.clientY;const jb=$('jb');jb.style.display='block';jb.style.left=TJ.x+'px';jb.style.top=TJ.y+'px';$('jk').style.transform='none'}
else if(TL.id==null){TL.id=t.identifier;TL.x=t.clientX;TL.y=t.clientY}}},{passive:false});
document.addEventListener('touchmove',e=>{if(state!=1||paused)return;e.preventDefault();for(const t of e.changedTouches){if(t.identifier===TJ.id){let dx=t.clientX-TJ.x,dy=t.clientY-TJ.y;const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;$('jk').style.transform=`translate(${dx}px,${dy}px)`}
else if(t.identifier===TL.id){look((t.clientX-TL.x)*.005,(t.clientY-TL.y)*.005);TL.x=t.clientX;TL.y=t.clientY}}},{passive:false});
function tend(e){for(const t of e.changedTouches){if(t.identifier===TJ.id){TJ.id=null;jx=jy=0;$('jb').style.display='none'}if(t.identifier===TL.id)TL.id=null}}
document.addEventListener('touchend',tend);document.addEventListener('touchcancel',tend);
// ---------- 업데이트 ----------
const mm=$('mm').getContext('2d');
function update(dt){cd-=dt;swT=Math.max(0,swT-dt);flT-=dt;
if(rlT>0){rlT-=dt;if(rlT<=0){W[cw].mag=W[cw].max}}
if(fireH&&(W[cw].auto||cd<=0))fire();
let ix=(K.KeyD?1:0)-(K.KeyA?1:0)+jx,iz=(K.KeyS?1:0)-(K.KeyW?1:0)+jy;const l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l}
const c=Math.cos(P.yaw),s=Math.sin(P.yaw),tx=(c*ix+s*iz)*7.5,tz=(-s*ix+c*iz)*7.5,k=Math.min(1,12*dt);P.vx+=(tx-P.vx)*k;P.vz+=(tz-P.vz)*k;
if((K.Space||jmp)&&P.y==0)P.vy=8.5;P.vy-=24*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y==0&&P.vy<0)P.vy=0;
P.x+=P.vx*dt;P.z+=P.vz*dt;push(P,.5,P.y);
const mv=Math.hypot(P.vx,P.vz);bobT+=dt*mv*1.3;
// 웨이브
if(spawnLeft>0&&en.length<12){spawnT-=dt;if(spawnT<=0){spawn();spawnLeft--;spawnT=.7}}
if(!spawnLeft&&!en.length){if(!gapOn){gapOn=1;gap=3;P.hp=Math.min(100,P.hp+40);addS(wave*200);W[2].mag=W[2].max;banner('WAVE '+wave+' CLEAR  +HP');SND.clear()}else{gap-=dt;if(gap<=0){gapOn=0;nextWave()}}}
// 적
const es=1+wave*.03;
for(const e of en.slice()){const p=e.g.position,dx=P.x-p.x,dz=P.z-p.z,d=Math.hypot(dx,dz)||1;e.g.rotation.y=Math.atan2(dx,dz);
e.fl-=dt;e.mats.forEach(m=>m.emissiveIntensity=m.base+(e.fl>0?4:0));
if(e.t=='r'){const mvd=d>16?1:d<9?-1:0,st=Math.cos(T*.9+e.sh);p.x+=(dx/d*mvd*3.2-dz/d*st*2.2)*dt*es;p.z+=(dz/d*mvd*3.2+dx/d*st*2.2)*dt*es;push(p,.6,0);
e.pr-=dt;e.eye.material.color.setHex(e.pr<.4?0xffffff:0xff2200);if(e.pr<=0){eShoot(e);e.pr=(1.3+R()*1.2)/(1+wave*.05)}}
else{const sp=(6+wave*.35)*dt,ty=1.2+Math.sin(T*3+e.sh)*.3,dy=ty-p.y,dd=Math.hypot(dx,dz,dy)||1;p.x+=dx/dd*sp;p.z+=dz/dd*sp;p.y+=dy/dd*sp;push(p,.55,p.y);e.ring.rotation.z+=dt*8;
if(Math.hypot(dx,dz)<1.2&&Math.abs(p.y-(P.y+1.1))<1.3){hurt(18);const c=p.clone();scene.remove(e.g);en.splice(en.indexOf(e),1);fxBoom(c,2.2,.5)}}}
// 적 탄
for(const b of eb.slice()){b.l-=dt;b.m.position.addScaledVector(b.v,dt);const p=b.m.position;let dead=b.l<=0;
if(Math.hypot(p.x-P.x,p.z-P.z)<.6&&p.y>P.y&&p.y<P.y+1.9){hurt(7+wave);dead=1}
for(const o of obs)if(p.y<o.h&&Math.abs(p.x-o.x)<o.hw&&Math.abs(p.z-o.z)<o.hd){dead=1;spark(p,0xff22aa,4,4,.25,.06)}
if(p.y<0)dead=1;if(dead){scene.remove(b.m);eb.splice(eb.indexOf(b),1)}}
// 수류탄
for(const g of gr.slice()){g.t-=dt;g.age+=dt;g.v.y-=20*dt;const p=g.m.position;p.addScaledVector(g.v,dt);g.m.rotation.x+=dt*8;
if(p.y<.14){p.y=.14;g.v.y*=-.45;g.v.x*=.75;g.v.z*=.75}
for(const o of obs)if(p.y<o.h&&Math.abs(p.x-o.x)<o.hw+.1&&Math.abs(p.z-o.z)<o.hd+.1){p.x-=g.v.x*dt;p.z-=g.v.z*dt;g.v.x*=-.5;g.v.z*=-.5}
let ex=g.t<=0;if(g.age>.15)for(const e of en)if(Math.hypot(e.g.position.x-p.x,e.g.position.y+e.cy-p.y,e.g.position.z-p.z)<1.2)ex=1;
if(ex){scene.remove(g.m);gr.splice(gr.indexOf(g),1);blast(p.clone(),8,140)}}
// 이펙트
for(const q of pts.slice()){q.l-=dt;q.v.y-=15*dt;q.o.position.addScaledVector(q.v,dt);if(q.o.position.y<.03){q.o.position.y=.03;q.v.y*=-.4}q.o.scale.setScalar(Math.max(.001,q.s*q.l/q.L));if(q.l<=0){scene.remove(q.o);pts.splice(pts.indexOf(q),1)}}
for(const t of trs.slice()){t.t-=dt;t.l.material.opacity=Math.max(0,t.t/.07);if(t.t<=0){scene.remove(t.l);t.l.geometry.dispose();trs.splice(trs.indexOf(t),1)}}
for(const x of exps.slice()){x.t+=dt;const f=x.t/.4;x.m.scale.setScalar(x.r*Math.min(1,f)+.1);x.m.material.opacity=Math.max(0,.8*(1-f));if(f>=1){scene.remove(x.m);exps.splice(exps.indexOf(x),1)}}
eL.intensity=Math.max(0,eL.intensity-dt*20);mL.intensity=Math.max(0,mL.intensity-dt*60);if(flT<=0)fl.visible=false;
// 카메라 / 총
sh=Math.max(0,sh-dt*3.5);kick=Math.max(0,kick-dt*10);
cam.position.set(P.x+(R()-.5)*sh*.12,P.y+1.7+(R()-.5)*sh*.12,P.z);
cam.rotation.set(P.pitch+(R()-.5)*sh*.04+kick*.01,P.yaw,(R()-.5)*sh*.06);
const rlk=rlT>0?Math.sin(Math.min(1,(W[cw].rl-rlT)/W[cw].rl)*Math.PI):0;
gunG.position.set(.26+Math.sin(bobT)*.006*(mv>1),-.24+Math.abs(Math.sin(bobT))*.008*(mv>1)-rlk*.18-swT*.5,-.5+kick*.1);
gunG.rotation.set(kick*.22+rlk*.7+swT*1.2,0,rlk*.4);
cam.fov=75+kick*1.5;cam.updateProjectionMatrix();
}
function hud(dt){dmgA=Math.max(0,dmgA-dt*1.6);const low=P.hp<30&&state==1?.25+.1*Math.sin(T*6):0;$('dmg').style.opacity=Math.max(dmgA*.9,low);
hmT=Math.max(0,hmT-dt);$('hm').style.opacity=hmT/.18;
$('hpb').style.width=P.hp+'%';$('hpt').textContent=Math.ceil(P.hp);const w=W[cw];$('am').textContent=w?(rlT>0?'RELOAD':w.mag+' / '+w.max):'';
banT=Math.max(0,banT-dt);$('ban').style.opacity=Math.min(1,banT);
const x=mm,S=55/45;x.clearRect(0,0,110,110);x.save();x.beginPath();x.arc(55,55,53,0,6.283);x.clip();
x.strokeStyle='rgba(0,255,255,.25)';x.beginPath();x.arc(55,55,27,0,6.283);x.stroke();x.beginPath();x.moveTo(55,0);x.lineTo(55,110);x.moveTo(0,55);x.lineTo(110,55);x.stroke();
const c=Math.cos(P.yaw),s=Math.sin(P.yaw),pl=(wx,wz,col,r)=>{const dx=wx-P.x,dz=wz-P.z;x.fillStyle=col;x.beginPath();x.arc(55+(dx*c-dz*s)*S,55+(dx*s+dz*c)*S,r,0,6.283);x.fill()};
obs.slice(4).forEach(o=>pl(o.x,o.z,'rgba(255,0,255,.5)',2));en.forEach(e=>pl(e.g.position.x,e.g.position.z,e.t=='r'?'#f36':'#fa0',3.5));
x.fillStyle='#0ff';x.beginPath();x.moveTo(55,49);x.lineTo(60,60);x.lineTo(50,60);x.fill();x.restore()}
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1e3);last=n;T+=dt;
if(state==1){if(!paused){update(dt);hud(dt)}}else{cam.position.set(Math.cos(T*.2)*26,7,Math.sin(T*.2)*26);cam.lookAt(0,2,0);gunG.visible=false;
for(const q of pts.slice()){q.l-=dt;if(q.l<=0){scene.remove(q.o);pts.splice(pts.indexOf(q),1)}}}
if(state==1)gunG.visible=true;ren.render(scene,cam)}
sw(0);requestAnimationFrame(loop);
